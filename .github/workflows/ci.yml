name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  feature-tests:
    name: Feature tests present
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-test-check')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require test changes for production changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"

          production_changes="$(printf '%s\n' "$changed" | grep -E '^src/main/' || true)"
          test_changes="$(printf '%s\n' "$changed" | grep -E '^src/test/' || true)"

          if [ -n "$production_changes" ] && [ -z "$test_changes" ]; then
            echo "::error::Production code changed without any test changes. Add or update tests under src/test, or apply the 'skip-test-check' label for non-behavioral changes."
            exit 1
          fi

          echo "Test policy satisfied."
